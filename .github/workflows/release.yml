name: Release

# Publishing to the Gradle Plugin Portal happens when a release tag is pushed.
# Tags are created by axion-release (./gradlew release), which derives the next
# version from existing tags — see build.gradle.kts (scmVersion).
#
# Secrets (GRADLE_PUBLISH_KEY/SECRET) live in the protected "release" environment,
# so publishing waits for a manual approval in the GitHub UI before it runs.
# pull_request events never see environment secrets.
on:
  push:
    tags: ['v*']

jobs:
  publish:
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # axion reads full history to derive the version from tags
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      # The tag is the source of truth for what gets published: fail early if
      # the tag and the version axion derives from it disagree.
      - name: Verify tag matches derived version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          DERIVED_VERSION="$(./gradlew -q currentVersion)"
          if [ "$TAG_VERSION" != "$DERIVED_VERSION" ]; then
            echo "Tag v$TAG_VERSION does not match derived version $DERIVED_VERSION" >&2
            exit 1
          fi

      # Same verification as CI before anything is published.
      - name: Build and test
        run: ./gradlew build --warning-mode=all

      - name: Publish to Gradle Plugin Portal
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew publishPlugins
